version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: sentra-postgres
    restart: always
    environment:
      POSTGRES_USER: sentra
      POSTGRES_PASSWORD: sentra_password
      POSTGRES_DB: sentra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentra -d sentra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sentra-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://sentra:sentra_password@db:5432/sentra_db
      - SECRET_KEY=sentra-production-docker-secret-key-32-chars-min
      - ENVIRONMENT=production
      - AI_PROVIDER_DEFAULT=mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentra-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
